name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mezgeb
          POSTGRES_USER: mezgeb
          POSTGRES_PASSWORD: mezgeb_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezgeb -d mezgeb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ROLE: api
      PORT: 3001
      PUBLIC_API_URL: http://localhost:3001
      MINIAPP_URL: http://localhost:5173
      LOG_LEVEL: warn
      SWAGGER_ENABLED: 'false'
      SWAGGER_PATH: docs
      DATABASE_URL: postgresql://mezgeb:mezgeb_ci_password@localhost:5432/mezgeb?schema=public
      REDIS_URL: redis://localhost:6379
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_WEBHOOK_SECRET: ci_webhook_secret_long_enough
      TELEGRAM_WEBHOOK_PATH: /webhook/telegram
      STT_PROVIDER: fake
      STT_MODEL: fake
      STT_LOCAL_COMMAND_OR_URL: ''
      STT_MODEL_PATH: .local/models
      EXTRACTION_PROVIDER: fake
      EXTRACTION_MODEL: fake
      EXTRACTION_PROMPT_VERSION: ci-v1
      EXTRACTION_LOCAL_BASE_URL: http://localhost:11434/v1
      ALLOW_LOCAL_DEV_AUTH: 'false'
      LOCAL_DEV_TELEGRAM_ID: 100000001
      CONSENT_VERSION: ci-v1
      MINIAPP_INIT_DATA_MAX_AGE_SECONDS: 3600
      MAX_VOICE_DURATION_SECONDS: 120
      MAX_VOICE_FILE_BYTES: 20000000
      MAX_MESSAGE_CHARACTERS: 2000
      MAX_TRANSACTIONS_PER_MESSAGE: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check repository hygiene
        run: npm run repo:check

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      - name: Verify source, tests, and builds
        run: npm run verify

      - name: Run PostgreSQL integration tests
        run: npm run test:integration --workspace @mezgeb/backend

      - name: Audit production dependencies
        run: npm audit --omit=dev
